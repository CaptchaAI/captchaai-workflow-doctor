[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "captchaai-workflow-doctor"
version = "0.2.2"
description = "Diagnostic CLI that walks a CAPTCHA-solving workflow end-to-end and reports the exact root cause of failure."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "CaptchaAI", email = "dev@captchaai.com" },
]
keywords = [
    "captcha",
    "captchaai",
    "captcha-solver",
    "diagnostics",
    "troubleshooting",
    "cli",
    "playwright",
    "recaptcha",
    "cloudflare-turnstile",
    "web-scraping",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "playwright>=1.40.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://captchaai.com/"
Documentation = "https://docs.captchaai.com/"
Repository = "https://github.com/CaptchaAI/captchaai-workflow-doctor"
Issues = "https://github.com/CaptchaAI/captchaai-workflow-doctor/issues"

[project.scripts]
captchaai-doctor = "captchaai_workflow_doctor.cli:main"
